name: ci-pr-main

on:
  pull_request:
    branches: [ main ]

env:
  RUST_VERSION: "1.100.0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check
